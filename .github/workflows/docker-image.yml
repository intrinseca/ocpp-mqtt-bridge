name: Docker Image CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  version:
    name: Resolve version and image tag
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.resolve.outputs.package_version }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - name: Validate ref and resolve version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            package_version="0.0.0.dev${RUN_NUMBER}"
            image_tag="pr-${PR_NUMBER}-${RUN_NUMBER}"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tag must be X.Y.Z with numeric components, no prefix, and no leading zeros: $REF_NAME" >&2
              exit 1
            fi
            package_version="$REF_NAME"
            image_tag="$REF_NAME"
          elif [[ "$REF_TYPE" == "branch" && "$REF_NAME" == "main" ]]; then
            package_version="0.0.0.dev${RUN_NUMBER}"
            image_tag="dev"
          else
            echo "Unsupported ref: $REF_TYPE/$REF_NAME" >&2
            exit 1
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  test:
    name: Test and Typecheck
    runs-on: ubuntu-latest
    needs: version
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        run: uv python install 3.12

      - name: Check lockfile
        run: uv lock --check

      - name: Install the project
        run: uv sync --frozen --all-extras --dev --python 3.12

      - name: Run tests
        run: uv run --no-sync pytest tests

      - name: Run typechecking
        run: uv run --no-sync mypy .

  pre-commit:
    runs-on: ubuntu-latest
    name: Lint with Pre-Commit
    needs: version
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1

  docker:
    runs-on: ubuntu-latest
    needs: [version, test, pre-commit]
    name: Build and Publish Docker Image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/intrinseca/ocpp-mqtt-bridge:${{ needs.version.outputs.image_tag }}
          build-args: |
            PACKAGE_VERSION=${{ needs.version.outputs.package_version }}
